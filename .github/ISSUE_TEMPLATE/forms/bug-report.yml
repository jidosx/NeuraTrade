name: Bug Report
description: Report a bug or issue with NeuraTrade
labels: [bug, help-wanted]
body:
  - type: markdown
    value: |
      **Bug Report**
      =============
      **Description**
      *Please describe the issue you're facing, including:*
      * NeuraTrade component(s) involved (e.g. trading engine, data feed, etc.)
      * Steps to reproduce (if applicable)
      * Expected vs. Actual Behavior
  - type: textarea
    id: description
    label: Description
    attributes:
      required: true
