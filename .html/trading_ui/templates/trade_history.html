<!-- trade_history.html -->
<div class="trade-history">
  <h1>Trade History</h1>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Time</th>
        <th>Symbol</th>
        <th>Quantity</th>
        <th>Profit/Loss</th>
      </tr>
    </thead>
    <tbody>
      {% for trade in trade_history %}
        <tr>
          <td>{{ trade.date }}</td>
          <td>{{ trade.time }}</td>
          <td>{{ trade.symbol }}</td>
          <td>{{ trade.quantity }}</td>
          <td>{{ trade.profit_loss }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
